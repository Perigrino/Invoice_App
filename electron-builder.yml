appId: com.invoiceflow.desktop
productName: InvoiceFlow
directories:
  output: dist
  buildResources: build
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .pack
    to: .
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  identity: null
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
